<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysia's Wind & Fashion Journey: 會考英文 A++ 戰術養成所</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 頂部導覽列 -->
        <header class="game-header">
            <div class="user-info">
                <h2>✨ Elysia 的風元素戰術養成所</h2>
                <p>目標：會考 A++ | 當前進度：<span id="progress-text">0 / 20</span></p>
            </div>
            <div class="stats-panel">
                <div class="stat-badge">🌪️ 風能：<span id="wind-energy">0</span></div>
                <button class="nav-btn" onclick="Game.openWardrobe()">👗 暖暖衣櫥：<span id="wardrobe-count">1/5</span> 件</button>
                <button id="btn-wrong-book" class="nav-btn">📖 錯題本 (<span id="wrong-count">0</span>)</button>
            </div>
        </header>

        <!-- 主遊戲畫面 -->
        <main class="game-main">
            <!-- 視窗 A：首頁選單 -->
            <section id="screen-menu" class="screen active">
                <div class="hero-card">
                    <h3>🌸 啟動你的 A++ 奇幻冒險</h3>
                    <p>結合《閃耀暖暖》的時尚衣櫥與《原神》流浪者的風元素破盾機制！過濾初級基礎字，專攻會考核心高頻單字、搭配詞與文法考點。</p>
                    
                    <!-- 💡 新增：已征服單字成就統計看板 -->
                    <div class="achievement-banner" style="background: rgba(124, 58, 237, 0.2); border: 1px solid #7c3aed; padding: 12px; border-radius: 12px; margin: 15px 0;">
                        <p style="margin: 0; font-size: 0.95rem; color: #f1f5f9;">🎯 目前已征服的會考單字：<strong id="total-mastered" style="color: #67e8f9; font-size: 1.25rem;">0</strong> / 2000 個</p>
                    </div>

                    <div class="menu-buttons">
                        <button class="primary-btn" onclick="Game.startDailySession()">🚀 開始今日 20 題特訓</button>
                        <button class="secondary-btn" onclick="Game.openWardrobe()">👗 查看我的暖暖衣櫥</button>
                    </div>
                </div>
            </section>

            <!-- 視窗 B：測驗進行中 -->
            <section id="screen-quiz" class="screen">
                <div class="battle-arena">
                    <div class="monster-box">
                        <span id="monster-icon">🌀</span>
                        <h4 id="monster-name">會考魔物：文法陷阱・狂風使者</h4>
                        <div class="hp-bar
